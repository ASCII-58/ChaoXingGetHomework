[package]
name = "xxt"
version = "0.1.0"
description = "Chaoxing homework notifier"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["api-all"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["cookies", "json", "gzip", "brotli", "deflate", "rustls-tls"] }
aes = "0.8"
cbc = "0.1"
base64 = "0.22"
urlencoding = "2.1"
dirs = "5"
regex = "1"
encoding_rs = "0.8"

[features]
custom-protocol = ["tauri/custom-protocol"]
