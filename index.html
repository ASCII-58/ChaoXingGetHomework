<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>学习通助手</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar">
        <div class="sidebar-header">
          <svg height="22" viewBox="0 0 16 16" width="22" class="sidebar-icon">
            <path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z" />
          </svg>
          <span class="sidebar-title">学习通助手</span>
        </div>

        <nav class="sidebar-nav">
          <a class="sidebar-link" href="#/homework">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="1.5" width="12" height="13" rx="1.5"/>
              <path d="M5.5 1.5h5v2a.5.5 0 0 1-.5.5H6a.5.5 0 0 1-.5-.5z"/>
              <line x1="5" y1="6.5" x2="11" y2="6.5"/>
              <line x1="5" y1="9.5" x2="11" y2="9.5"/>
              <line x1="5" y1="12.5" x2="9" y2="12.5"/>
            </svg>
            作业
          </a>
          <a class="sidebar-link" href="#/settings">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="8" cy="8" r="2.2"/>
              <path d="M8 1.3l1.1 2.4a1 1 0 0 0 .8.6l2.5.3-1.8 1.7a1 1 0 0 0-.3.9l.5 2.4-2.2-1a1 1 0 0 0-.6 0l-2.2 1 .5-2.4a1 1 0 0 0-.3-.9L3.6 4.6l2.5-.3a1 1 0 0 0 .8-.6L8 1.3z"/>
            </svg>
            设置
          </a>
        </nav>

        <div class="sidebar-footer">
          <div class="sidebar-footer-left">
            <span class="status-dot" id="status-dot"></span>
            <span class="status-text" id="status-pill">未连接</span>
          </div>
          <button class="sidebar-logout" id="sidebar-logout" title="退出登录">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 2H3.5A1.5 1.5 0 0 0 2 3.5v9A1.5 1.5 0 0 0 3.5 14H6"/>
              <path d="M11 2h1.5A1.5 1.5 0 0 1 14 3.5v9a1.5 1.5 0 0 1-1.5 1.5H11"/>
              <path d="M6 8h8"/>
              <path d="M11.5 5.5L14 8l-2.5 2.5"/>
            </svg>
          </button>
        </div>
      </aside>

      <main class="main" id="app-content"></main>
    </div>

    <div class="ignore-panel-overlay" id="ignore-panel-overlay"></div>
    <div class="ignore-panel" id="ignore-panel">
      <div class="ignore-panel-header">
        <span class="ignore-panel-title">管理忽略</span>
        <button class="ignore-panel-close" id="ignore-panel-close" title="关闭">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M4 4l8 8M12 4l-8 8"/>
          </svg>
        </button>
      </div>
      <div class="ignore-panel-body" id="ignore-panel-body"></div>
    </div>

    <div class="toast" id="toast">
      <svg class="toast-icon" viewBox="0 0 16 16" width="16" height="16" id="toast-svg">
        <path d="M8 16A8 8 0 1 1 8 0a8 8 0 0 1 0 16Zm3.78-9.72a.751.751 0 0 0-1.042-.018L6.75 10.1l-2.25-2.25a.751.751 0 0 0-1.042 1.042l2.75 2.75a.75.75 0 0 0 1.06 0l4.5-4.5a.751.751 0 0 0-.018-1.042Z"/>
      </svg>
      <span id="toast-message"></span>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
